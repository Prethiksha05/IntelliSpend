# ======================================================================
# IntelliSpend — Application Configuration
# ======================================================================

spring:
  application:
    name: intellispend-backend

  # ============================
  # Database Configuration (Default: H2 In-Memory with MySQL compatibility)
  # ============================
  datasource:
    url: ${DB_URL:jdbc:h2:mem:intellispend_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      pool-name: IntelliSpendHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  h2:
    console:
      enabled: true
      path: /h2-console

  # ============================
  # JPA / Hibernate
  # ============================
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    open-in-view: false

  # ============================
  # File Upload
  # ============================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ============================
# Server Configuration
# ============================
server:
  port: ${SERVER_PORT:8080}

# ============================
# JWT Configuration
# ============================
app:
  jwt:
    secret: ThisIsAVeryLongSecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLongForHS256Algorithm
    access-token-expiration-ms: 86400000      # 24 hours
    refresh-token-expiration-ms: 604800000    # 7 days

  # ============================
  # ML Service Configuration
  # ============================
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: 3000

  # ============================
  # CORS Configuration
  # ============================
  cors:
    allowed-origins: "http://localhost:4200,http://127.0.0.1:4200"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

# ============================
# Actuator
# ============================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================
# SpringDoc / Swagger
# ============================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ============================
# Logging
# ============================
logging:
  level:
    com.intellispend: INFO
    org.springframework.security: WARN
