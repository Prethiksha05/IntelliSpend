<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="anomalyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="500" height="280" rx="20" fill="url(#bgGrad)"/>

  <!-- Grid Lines -->
  <line x1="40" y1="220" x2="460" y2="220" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="160" x2="460" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="100" x2="460" y2="100" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <line x1="40" y1="40" x2="460" y2="40" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>

  <!-- Normal Bars -->
  <rect x="70" y="140" width="30" height="80" rx="6" fill="url(#barGrad1)"/>
  <rect x="125" y="110" width="30" height="110" rx="6" fill="url(#barGrad2)"/>
  <rect x="180" y="150" width="30" height="70" rx="6" fill="url(#barGrad1)"/>
  <rect x="235" y="125" width="30" height="95" rx="6" fill="url(#barGrad2)"/>

  <!-- Anomaly Spike Bar -->
  <rect x="290" y="45" width="32" height="175" rx="6" fill="url(#anomalyGrad)"/>
  <!-- Warning icon badge above anomaly -->
  <circle cx="306" cy="25" r="14" fill="#fee2e2" stroke="#f43f5e" stroke-width="2"/>
  <text x="306" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e11d48" text-anchor="middle">!</text>

  <!-- After Anomaly Bars -->
  <rect x="345" y="130" width="30" height="90" rx="6" fill="url(#barGrad1)"/>
  <rect x="400" y="145" width="30" height="75" rx="6" fill="url(#barGrad2)"/>

  <!-- Trend Line -->
  <path d="M 85 140 Q 140 100 195 150 T 250 125 T 306 45 T 360 130 T 415 145" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="85" cy="140" r="4" fill="#4f46e5"/>
  <circle cx="140" cy="110" r="4" fill="#06b6d4"/>
  <circle cx="195" cy="150" r="4" fill="#4f46e5"/>
  <circle cx="250" cy="125" r="4" fill="#06b6d4"/>
  <circle cx="306" cy="45" r="6" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>
  <circle cx="360" cy="130" r="4" fill="#4f46e5"/>
  <circle cx="415" cy="145" r="4" fill="#06b6d4"/>

  <!-- Floating AI Badge Card -->
  <g transform="translate(60, 30)">
    <rect width="160" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
    <circle cx="22" cy="21" r="10" fill="#10b981"/>
    <path d="M 18 21 L 21 24 L 27 18" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="38" y="19" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">ML Isolation Forest</text>
    <text x="38" y="32" font-family="Arial, sans-serif" font-size="9" fill="#10b981" font-weight="600">Real-Time Active</text>
  </g>
</svg>
