name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build-and-test:
    name: Build & Test Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/expense-management-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend/expense-management-angular
        run: npm ci --legacy-peer-deps

      - name: Run linting
        working-directory: frontend/expense-management-angular
        run: npm run lint || true

      - name: Run unit tests
        working-directory: frontend/expense-management-angular
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build production
        working-directory: frontend/expense-management-angular
        run: npm run build -- --configuration production

      - name: Build Docker image
        working-directory: frontend/expense-management-angular
        run: docker build -t intellispend-frontend:${{ github.sha }} .
