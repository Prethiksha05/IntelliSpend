name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: intellispend_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend/expense-management-springboot
        run: mvn clean compile -B

      - name: Run tests
        working-directory: backend/expense-management-springboot
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: intellispend_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-only-not-production
          ML_SERVICE_URL: http://localhost:8000
        run: mvn test -B

      - name: Build JAR
        working-directory: backend/expense-management-springboot
        run: mvn package -DskipTests -B

      - name: Build Docker image
        working-directory: backend/expense-management-springboot
        run: docker build -t intellispend-backend:${{ github.sha }} .
