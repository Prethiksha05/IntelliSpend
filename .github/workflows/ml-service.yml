name: ML Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ml-service/**'

jobs:
  build-and-test:
    name: Build & Test ML Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml-service/anomaly-detection/requirements.txt

      - name: Install dependencies
        working-directory: ml-service/anomaly-detection
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ml-service/anomaly-detection
        run: pytest tests/ -v --tb=short

      - name: Start service and verify health
        working-directory: ml-service/anomaly-detection
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          kill %1

      - name: Build Docker image
        working-directory: ml-service/anomaly-detection
        run: docker build -t intellispend-ml:${{ github.sha }} .
